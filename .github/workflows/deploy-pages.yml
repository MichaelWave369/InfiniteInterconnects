name: Publish Infinite Interconnects

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infinite-interconnects-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Verify and package React site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test governed fabric
        run: npm test
      - name: Build React site
        run: npm run build
      - name: Verify Pages assets
        run: node scripts/verify-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
